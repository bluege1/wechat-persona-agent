# ══════════════════════════════════════════════════════
#  白佰岚 · 配置
#  改完存盘，重启 bridge.py 生效。带 ★ 的是必须改的。
# ══════════════════════════════════════════════════════

# ★ 盯着哪个会话。填你大号在小号里的显示名（昵称或你给的备注）
target: 对方昵称

# ★ 大脑：OpenAI 兼容接口都行，DeepSeek / 豆包 / 通义 / 硅基流动
llm:
  # ★ 注意是 api.siliconflow.cn（接口），不是 cloud.siliconflow.cn（官网控制台）。
  #   写成 cloud 那个会返回网页 HTML，程序报 "Expecting value: line 1 column 1"。
  base_url: "https://api.siliconflow.cn/v1"
  api_key: sk-在这里填你自己的Key
  # ★ 模型名要带厂商前缀。硅基流动上 DeepSeek 系列是 deepseek-ai/xxxxx
  model: deepseek-ai/DeepSeek-V4-Flash
  temperature: 1  # 调高一点，更像人、不那么"标准答案"（白佰岚是冷的那种，对他是热的）
  max_tokens: 500

# 发声：WeeMessenger 的 HTTP 地址，它启动后默认就是这个，一般不用改
sender:
  host: "127.0.0.1"
  port: 9877
  # 后台发送（推荐开着）。开了以后，只要微信当前打开的就是 target 那个会话，
  # 白佰岚发文字时【不会把微信窗口抢到前台，也不会动你的鼠标】——
  # 你可以照常全屏打游戏、写东西，消息从背后发出去。
  # 前提：微信窗口要保持「显示」状态（可以被别的窗口盖住，但不能最小化到托盘）。
  # 会话对不上时会自动退回前台发送，不会发错人。
  background: true

# 语音条
#
# ⚠️ 语音条和文字消息的"脾气"完全不同，先看清楚再决定开不开：
#    文字：可以完全后台发，微信不跳前台、鼠标不动（推荐主力用这个）。
#    语音：微信 4.1.9 起才支持电脑端发语音，做法是模拟"按住发送语音消息
#          快捷键（默认【右 Alt】）" + 把 TTS 音频送进虚拟声卡 CABLE Input，
#          微信再从 CABLE Output 录进去 —— 所以【一定会抢前台】。
#          如果微信里绑的键跟程序按的不是同一个，语音条就永远发不出来。
#          ⚠ 别和「语音输入文字」搞混 —— 那是 4.1.8 的功能，入口是输入框
#            下方工具栏的小话筒（或按住 Ctrl+Win），产物是【文字】。
#          自检：双击根目录的「6-查语音.bat」，选 2 会自动对比左/右 Alt。
#    而且：发不出去时，程序会把这段内容改用文字补发，不会让回复凭空消失。
#
# enabled 是总开关：改成 false 就一律发文字，纯后台、零干扰。
voice:
  enabled: true

  # 什么时候发语音（四选一，写英文）：
  #   trigger  默认。对方话里出现下面的 trigger_words、或者对方发的就是语音，
  #            这一轮才发语音；其余全发文字。← 你想听她说话时喊一声就行
  #   ratio    按 ratio 的概率随机混着发（会感觉忽声忽文）
  #   always   每轮都发语音（长回复会被切成好几条，最吵）
  #   never    只发文字（等同于 enabled: false）
  mode: trigger

  ratio: 0.4                # 仅 mode: ratio 时生效

  reply_to_voice: true      # 仅 mode: trigger 时生效：对方发语音就用语音回

  # 触发词：对方消息里出现任意一个，这一轮就发语音。
  # 反过来，如果对方说「别发语音 / 打字就行 / 在开会」之类，一律发文字。
  trigger_words:
    - 发语音
    - 发条语音
    - 发个语音
    - 来段语音
    - 来条语音
    - 用语音
    - 语音回
    - 发个声
    - 出个声
    - 说给我听
    - 讲给我听
    - 念给我听
    - 说句话
    - 听听你的声音
    - 听听声音
    - 用嘴说

  # ── 音色：白佰岚用谁的声音说话 ──────────────────────────────
  #
  # 你从网上找的「白佰岚语音模型」，放这个文件夹里：
  #     白佰岚\音色\
  # 放什么、怎么放，看那个文件夹里的 说明.txt。
  #
  # engine 二选一：
  #   edge   微软 Edge-TTS 的内置播音音色。免费、在线、不用装任何东西，
  #          但【不是白佰岚的声音】，只是随便一个女声。
  #   local  你自己准备的白佰岚音色。要先跑一个本地语音模型
  #          （推荐 GPT-SoVITS），配置见下面的 local 段。
  engine: edge

  # ── 只有 engine: local 时才看这一段 ────────────────────────
  # 路径都相对「白佰岚」目录，写 音色/xxx 就行。
  local:
    # 本地语音引擎地址。GPT-SoVITS 的 api_v2.py 默认就是这个
    api: "http://127.0.0.1:9880"

    # 参考音频：白佰岚说话的 3~10 秒切片（干净、单人、无背景音、无 BGM）
    ref_audio: ""   # 留空 → engine: edge 时用 edge_voice；想用她自己的声音，切片放 音色\白佰岚.wav 再填 "音色/白佰岚.wav"

    # 上面那段音频里她说的话，原样打一遍（中文即可）。
    # 留空的话，程序会自动去读同名的 音色/白佰岚.txt
    ref_text: ""

    # 模型权重（可选）。从网上下的角色模型包解压到 音色\ 里，
    # 再把相对路径填这儿。填了，第一次合成时会自动切过去；
    # 不填就用引擎自己配置里的默认模型。
    #   gpt_weights:    "音色/模型/白佰岚-e15.ckpt"      （GPT 模型）
    #   sovits_weights: "音色/模型/白佰岚_e15_s300.pth"  （SoVITS 模型）
    gpt_weights: ""
    sovits_weights: ""

    # 语种 / 切句方式 / 语速 / 超时。一般都不用改
    text_lang: "zh"
    prompt_lang: "zh"
    text_split_method: "cut5"
    speed_factor: 1.0
    timeout: 180

  # ── 只有 engine: edge 时才有用 ─────────────────────────────
  # 这几个对 local 引擎无效（音色由你自己的模型决定）。
  # edge_voice 只是随便挑一个微软音色，不是白佰岚本人。
  edge_voice: "zh-CN-XiaoxiaoNeural"   # 微软·晓晓，女声
  rate: "+0%"               # 语速：+10% 快一点，-10% 慢一点
  pitch: "+0Hz"             # 音调：+30Hz 更亮更年轻，-30Hz 更低沉
  volume: "+0%"             # 音量：一般不用动

  max_seconds: 55           # 微信单条上限 60 秒，留点余量
  chars_per_second: 4.5     # 估算语速，用来把长回复切成多条语音条

# 对方发来的语音（白佰岚怎么才能"听懂"）
#
#   收消息走的是「截图 + OCR」，OCR 只能"看"，听不到声音 ——
#   对方发语音时，白佰岚能拿到的只有 `[语音] 2"` 这种字样。
#
#   想让她真听懂，用微信自带的转文字（免费、不用装任何模型）：
#     微信 → 左下角≡ → 设置 → 通用 →
#     勾上「聊天中的语音消息自动转成文字」
#   打开后语音条下面会直接显示文字，白佰岚读到文字就等于听懂了。
#
#   万一你那个版本找不到这个开关：先右键点任意一条收到的语音 → 选「转文字」，
#   能转出来说明只是设置位置不同；转不出来就是这个版本不支持自动转写。
#   那样的话保持现状即可 —— 她会用自己语气说一句"你发语音我听不到，
#   打字跟我说吧"，绝不会假装听懂了内容。

# 拟人节奏 + 保命设置
behavior:
  poll_interval: 2.5        # 多久扫一次新消息（秒）。收消息靠截图+OCR，一轮约 1 秒
  reply_delay_min: 1.0      # 回复前的随机延迟，别秒回
  reply_delay_max: 3.5

  # 微信口语化（强烈建议开着）—— 不管模型听不听话，发出去之前统一改一遍。
  # 模型写惯了书面语：一句话塞四五个逗号、一条三十字，一眼就是 AI 味。
  #   逗号 顿号 分号 冒号 句号   →  断句（等于「切下一条发」）
  #   问号 感叹号 省略号 波浪号  →  留着，后面也断
  #   引号 书名号 括号           →  去掉（微信口语不打这些）
  wechat_style: true

  # 长回复拆成几条连着发 —— 真人不会一口气发一大段。
  # 拆开之后每条间隔 0.6~1.8 秒，节奏更像在打字。
  #
  # ★ 下面这三个数，只要 share.enabled 开着（默认开），就会被
  #   「分享.py 里按关系档位的预算」接管 —— 关系越浅，她一次说得越少。
  #   这里填的值只在分享欲关掉、或 share.length_by_stage=false 时才生效。
  split_replies: true
  split_chars: 15           # 一条最多这么多字，超了【强行切开】（不再只在句子上拆）
  split_max_parts: 6        # 最多几条；再多说明她话痨了，会均匀并成这么多条
  total_chars: 55           # 一次回复总字数上限（0 = 不限）。注意它会丢掉没发出去的话，
                            # 而她记忆里以为自己说了 —— 所以只建议配合档位用。

  # 剥掉动作描写和旁白（*笑*、（歪头）【沉默】这类）。
  # persona.md 里已经禁止了，这里是不管模型听不听话都生效的兜底。
  # 你要是就想让她带点动作描写，改成 false。
  strip_actions: true

  max_per_hour: 40          # 每小时最多发几条，防止异常节奏触发风控

  # 她睡觉的时段（默认凌晨 0 点到 7 点）。
  #
  #   ★ 只管【她主动找你】—— 这个时间段她不会自己开口。
  #     **你发消息她照样回！** 被消息叫醒也得回，只是回得慢一点、短一点、
  #     带半句刚醒的迷糊（「嗯？」「几点了」「刚睡着」）。
  #     这条不是可选项：半夜把人晾着，比回得慢伤人得多。
  #   ★ 没有「连回复也停掉」的开关，也不打算加 —— 那等于让她装死。
  #   ★ 她「刚被叫醒」之后多久才摸到手机，看下面两个数。
  quiet_hours: [0, 7]

  # 深夜被消息叫醒后，她多久才摸到手机（秒）。
  # 只是拟人节奏：这段等待是「她醒了、在摸手机」，不是「她不回」。
  # 关掉 humanize 就一律不延迟，但她还是会回。
  night_wake_min: 6
  night_wake_max: 20

  # 开机补一句。
  # 背景：她启动时会把「此刻已经在屏幕上的消息」记成看过了，故意不回 ——
  # 免得关一天再开、把攒下的一屏旧消息挨个回一遍。
  # 副作用是「他刚发完、你才把程序点开」的那条会被吞掉，他那边干等一个回复。
  # 打开这个开关后：开机时最后一条若是对方发的（球在她这边），她就补一句，
  # 而且会按「刚拿到手机」的语气说（「刚看到」这种）。
  catch_up: true
  # 离开超过这么多分钟就不补了（防止关了几天、回来回一条几天前的消息）。
  # 写 0 = 不限制，隔多久都补。
  catch_up_max_minutes: 0

# 收消息走的是「后台截图 + OCR」，聊天区位置由脚本自动测。
# 平时一个字都不用改。
# 只有在「3-自检.bat」存出来的 日志\消息自检-整屏.png 里，
# 红框明显框偏了的时候，才需要把下面这段的注释去掉手动钉死。
# 值小于 1 当「占窗口宽/高的比例」，大于等于 1 当像素。
# screen:
#   chat_left:   0.231      # 聊天区左边界（会话列表右边缘）
#   chat_right:  0.989      # 聊天区右边界
#   chat_top:    0.113      # 消息区上边界（标题栏下边缘）
#   chat_bottom: 0.778      # 消息区下边界（输入框上边缘）

# ══════════════════════════════════════════════════════
#  拟真：节奏、平行生活、主动找你
# ══════════════════════════════════════════════════════

# 她有自己的日子 —— 这是「像真人」里最要紧的一块。
#
#   程序每天给她随机生成一份日程：天气、心情、精力、上午/下午/晚上各几件事、
#   一件小插曲、今天惦记的东西。随真实时间自动推进，绝不会出现
#   「下午三点还说等下要去吃早饭」这种穿帮。
#   聊天时把「她那边几点、在干嘛、今天发生了什么」塞进对话，
#   她就有了可以聊的事，而不是只会回应你说的话。
#
#   想看她今天过着什么日子：
#       .venv\Scripts\python.exe daily_life.py
#   看素材还剩多少（重要）：
#       .venv\Scripts\python.exe daily_life.py --stock
#   觉得今天太平淡，重摇一个：
#       .venv\Scripts\python.exe daily_life.py --refresh
life:
  enabled: true
  file: "生活/今天.json"     # 状态存这儿，不用手改
  recap_max: 6              # 每次喂给她「今天到现在」几件事
  rare_chance: 0.18         # 今天摇到「一件少见的事」的概率（0.18 ≈ 六天一次）

  # ★ 素材是消耗品：用掉一条就永久划掉，不会再出现第二次。
  #   556 条按每天 7 条左右算，够玩两个多月。剩得不多了就往「素材.py」里加。
  #   这里填 0 = 永不复用（默认）。要是你哪天想让她把这些事重讲一遍，
  #   填个天数（比如 150），那么 150 天前用过的素材就会回到池子里。
  reuse_after_days: 0

  # ── 今天这一天的「偏移」（见 日计划.py）──────────────────────────────
  #
  #   固定课表是底子，天天一样；偏移是「今天她起晚了 / 差点迟到 / 失眠」。
  #   不加这一层，聊三天就能看出她的作息是个表。
  #
  #   enabled: true 才会生效（默认 false = 照基准作息，一行不动）。
  #   source:
  #     auto  —— 一天开始调一次 API 排今天这一份；失败/没网就本地现算（推荐）
  #     api   —— 只走 API，失败也回落本地（跟 auto 一样的安全网）
  #     local —— 从不请求，永远本地现算（离线、零 token）
  #   horizon_hours: 「两小时原则」——一天排一份，但**喂给她的细日程只到
  #     从现在起这么多小时**，再往后只报里程碑（起床 / 吃饭 / 洗澡 / 睡）。
  #     一分钟一段地铺一整天，反而把要紧的几句淹掉。
  day_plan:
    enabled: true
    source: auto
    horizon_hours: 2

# 大事件（她的连续剧）
#
#   素材池里都是「今天发生了一件小事」，说完就过去了。
#   大事件是「一件有头有尾、要演好几天的事」——
#   比如她说这周要考试：今天提考试，明天复习，后天考试，大后天出成绩。
#   她会连着几天惦记同一件事，这就非常像真的在过日子。
#
#   18 条剧本来在 大事.py，有的地方还写了两种走向（随机走一条）。
#   同时最多演 2 条，演完的不会重演。
#
#   想看她现在在演什么：
#       .venv\Scripts\python.exe 大事.py
#       .venv\Scripts\python.exe 大事.py --list        列全部剧本
#       .venv\Scripts\python.exe 大事.py --preview first_meet   看某条的完整剧本
story:
  enabled: true
  file: "生活/剧情.json"     # 演到哪儿了存这儿，不用手改
  max_active: 2             # 同时最多几件事在演（1 条会显得单薄，3 条容易乱）
  gap_days: [4, 9]          # 两条大事之间隔几天再开新的

# 打字节奏 —— 决定她像不像一个正在打字的人
humanize:
  enabled: true

  # 打字耗时：每个字大约几秒。0.09 ≈ 一个字 90 毫秒，接近真人手机打字
  typing_speed: 0.09
  typing_jitter: 0.6        # 再叠一个 0~0.6 秒的随机抖动

  # 一条回完，下一条之前停顿多久（模拟「想一想 / 打了删掉重打」）
  gap_min: 1.2
  gap_max: 4.5

  # ★ 「她正在忙」（10% 概率随机拖 40~150 秒才回）2026-09-22 已删。
  #   原因：他那边看到的就是「她明明在线却不回」，而且不知道她在忙什么。
  #   现在只剩两种等待：深夜被叫醒（6~20 秒，而且会写进提示）、
  #   平时 1~3.5 秒（behavior.reply_delay_*）。

# 她会主动找你 —— 网恋感的关键。没有这一条，她就永远只是个应答机。
#
#   触发条件（全部满足才发）：
#     · 距上次聊天超过 min_idle_minutes 分钟
#     · 在 active_hours 时间段内（她也要睡觉）
#     · 没超过每小时 / 每天的上限
#     · 掷骰子中了 chance_per_tick
#   内容不是干巴巴的「在吗」，而是挑一件她今天还没跟你说过、
#   又有点说头的事开头（话题种子来自上面 life 的日程）。
proactive:
  enabled: true
  min_idle_minutes: 35  # 至少这么久没说话才会主动找你
  chance_per_tick: 0.03  # 每次轮询的触发概率（轮询间隔见 poll_interval）
  active_hours: [9, 23]  # 她只在 9 点到 23 点之间主动发消息
  max_per_hour: 1
  max_per_day: 6
  # ★ 她走不开的时候**不主动开口**（2026-09-22 加）
  #
  #   上课 / 睡着的时候她不会自己先找你 —— 真人上课时不会先找人聊天。
  #   实测踩过：10:28 自检说她在上课，她同一分钟发来「电梯里碰到一群新生」，
  #   同一个屏幕上两句话打架（那条素材的时间戳是 10:26，正好落在课里）。
  #   判断用的是分钟级作息表，跟「她自检」看到的完全一致：
  #   控制台上她在上课，这里就一定不会开口。
  #   ⚠ 只管「她主动找你」这一路 —— **他发消息来她照样回**，不受影响。
  #   改成 false 就恢复「什么时候都会开口」。
  quiet_when_busy: true

# 记忆（短期）
#
#   只存最近多少轮 —— 再多模型也读不完。
#   想让她记得更早的事，靠下面的「定期总结」，不是靠把这个数调大。
memory:
  turns: 40
  file: "memory.json"

# 定期总结（长期记忆）
#
#   平时 memory 只留最近 40 轮。聊到第 200 轮的时候，前面早就被挤没了 ——
#   她会犯那种最出戏的错：你提起一件事，她一脸茫然。
#
#   所以每过一段时间，让她自己复盘一次，把这段对话沉淀成「长期记忆」，
#   之后每一轮都带着。这样她记得住的就不是 40 轮，而是从头到现在。
#
#   想看她记住了什么：双击「8-看记忆.bat」，或者
#       .venv\Scripts\python.exe journal.py --show
journal:
  enabled: true
  dir: "记忆"               # 存哪儿（总结.json + 备忘录.md）
  every_turns: 25           # 攒够这么多轮就复盘一次
  every_hours: 8            # 或者距上次过这么久也复盘（两个条件满足其一即可）
  min_turns: 6              # 少于这么多轮不记（免得把寒暄也记下来）
  core_chars: 900           # 「长期记忆」那段字数上限（超了模型会自己挑重点）
  keep_entries: 24          # 历次复盘最多留多少条
  # ★ 复盘是「记忆」不是「日记」（2026-09-22 收窄）
  #
  #   用户原话：「只要记录一下关系的进展和一些重要的事情就行了吧，
  #             重要的事情包括我的信息，我们的约定，我的性格，我的态度
  #             之类的，模拟人类的记忆系统，不重要的东西就忘掉，
  #             不然这样聊个几百轮 token 直接爆炸了」
  #
  #   所以现在只记五类：关系进展 / 他的信息 / 约定 / 他的性子 / 她还没
  #   弄明白的；最多 5 条 120 字（程序硬截），去重。吃了什么、他打了多久
  #   游戏、谁先说了晚安 —— 一律不写。一段里没有值得记的，就不落这条复盘。
  #   想看她说短了没：python journal.py --show
  #   想把改规矩之前那几篇流水账忘掉（长期记忆不动）：
  #       python journal.py --forget

# 关系进度（你们到哪一步了）
#
#   ★ 这里没有「认识多少天」这种设置 —— 故意的。
#   档位只由「亲密度」决定：聊一轮涨一点，每天涨的有上限，
#   所以发展快不起来，只能一天一天攒。
#
#   一共五档，前四档只按分数自动晋升：
#       1 初遇      1 - 200        刚认识，还端着
#       2 朋友      200 - 600      会主动找你了
#       3 重要的人  600 - 1000     开始会闹脾气、吃醋
#       4 暧昧      1000 - 没上限
#       5 恋人      ← 不是台阶，是一道门：只有表白才进得去（见下面 confess: 段）
#   每一档具体什么态度，写在 你和我.md 里（第 5 档那一大节平时她读不到）。
#
#   想看她现在到哪一档：双击「8-看记忆.bat」选 2，或者
#       .venv\Scripts\python.exe relation.py --show
relation:
  state_file: "关系.json"   # 程序自己维护，不用手改
  daily_cap: 200             # 每天最多涨多少分 ★ 这是唯一能控制快慢的旋钮
  idle_days: 3              # 连着这么多天没聊，之后开始慢慢冷下来
  cool_per_day: 0.03        # 冷下来的速度（每天掉 3%）
  # 想让她发展得更慢：daily_cap 调小（比如 25）。
  # 想快点：调大（比如 80）。别调太猛，跳级就假了。
  #
  # stages: 五档的「区间 + 每档说多少」，一般不用在这里手写 ——
  #   打开「7-控制台.bat」→ 左边「好感度」页改，保存时程序会自动写回这一段。
  #   手写格式（想自己改的话，照这个来）：
  #     stages:
  #       - key: meet
  #         name: 初遇
  #         from: 1
  #         to: 200
  #         say_per_day: 1        # 一天说几句自己的事
  #         say_chars: 15         # 一条最多几字
  #         say_parts: 2          # 一次最多几条
  #         say_total: 20         # 一次总共几字
  #         say_tokens: 60        # 生成时掐多少 token
  #         active_per_day: 0     # 一天主动找你几次
  #         idle_scale: 1.8       # 安静多久才想起你的倍数
  #         allow: []             # 允许说的话：名字 / 想你 / 撒娇 / 闹脾气
  #       ……（第 5 档 key: lover，写 gate: confess、不写 from/to）

# 好感度 · 表白 —— 第 4 档满了之后那一整套（见 relation.py / 表白.py / 你和我.md）
#
#   ★ 第五档「恋人」跟前面四档不是一回事，它不靠分数 ——
#     亲密度涨到天上去也推不开这扇门。进门之后她是另一套规矩：
#     见 你和我.md 第 5 档（那一节在她到恋人之前是读不到的），
#     以及 表白.py 里的 LOVER_RULES（12 条，每轮都在她眼前）。
#
#   两条表白的路，完全不同：
#     ① 他先开口 —— 一句话直接说。基础成功率只有 25%，因为那样她会觉得敷衍；
#        用心准备过才高。★ 但她**不会拒绝**，只会叫你回去好好想想该怎么表白。
#        用心分怎么算见下面 prep_weights：七样东西各值多少分。
#     ② 她先开口 —— 亲密度过了 line（默认 2000）之后，她开始一层一层地暗示
#        （绝不直接说要表白），铺满 hint_days 天之后，每天 her_chance 的概率
#        自己开口。这时候你答应就进第 5 档；**拒绝她会极伤心**、
#        自暴自弃 despair_days 天，亲密度直接掉回 refuse_drop_to。
#
#   还有第三条：她暗示铺完之后你太久不接，她可能自己把这份心思收回去
#   （轻症，give_up_after_days / give_up_chance）。你不提就当没这回事，
#   但你要是自己开口，她还是会听。
#
#   这一整套也能在控制台里改：「7-控制台.bat」→ 左边「好感度」页。
#   想手动推进 / 重来（调试）：
#       .venv\Scripts\python.exe relation.py --confess
#       .venv\Scripts\python.exe relation.py --reset-confess
confess:
  line: 2000                  # ★ 亲密度到这里，她开始暗示（也是他表白的最低门槛）
  direct_chance: 0.25         # ★ 他直接表白的基础成功率（25%）
  prep_scale: 0.006           # 用心分每 1 分加多少成功率（满分 +60%）
  repeat_penalty: 0.05        # 随便表白一次扣多少成功率
  hint_days: 3                # 暗示铺满要几天（共四层，一天深一层）
  her_chance: 0.12            # ★ 铺完之后，她每天自己开口的概率
  give_up_after_days: 10      # 她等这么多天还没等到，就可能把心思收回去
  give_up_chance: 0.05        # 到那天「收回去」的概率
  refuse_drop_to: 600         # ★ 你拒绝她 → 亲密度掉回这里（600＝重要的人）
  despair_days: 7             # ★ 被拒之后自暴自弃几天
  despair_gain_scale: 0.2     # 自暴自弃期间亲密度涨得慢多少（只剩两成）
  prep_weights:               # 用心分七项各值多少（加起来就是满分 100）
    len: 10                   # ① 话说得够长（≥60 字）
    name: 10                  # ② 叫了她的名字
    past: 20                  # ③ 提到你们之间的事（她跟你说过的那些）
    why: 15                   # ④ 说清「为什么是她」
    night: 10                 # ⑤ 深夜说的（22:30 – 02:00，她最不设防）
    build: 15                 # ⑥ 最近这几天一直在铺垫
    gift: 20                  # ⑦ 带着东西（照片 / 语音 / 礼物）

# 分享欲 · 联想 —— 她刚认识你的时候，不该把今天干了什么全倒给你
#
#   治两个毛病：
#
#   ① 她太爱说自己。才聊十几轮，就把今天买书、试衣服、吃甜点全讲一遍。
#      真人不是这样 —— 刚认识的人只会「没干嘛」，问三句答一句。
#      所以按关系档位给一个分享欲（见 分享.py 的 STAGES）：
#        第 1 档  一天最多顺口提自己 1 次，一次总共 22 个字、最多 2 条，
#                 【不主动找你】—— 她还在端着
#        第 2 档  2 次 / 34 字 / 3 条，一天最多主动 1 条
#        第 3 档  3 次 / 45 字 / 3 条，开始会主动找你
#        第 4 档 暧昧     4 次 / 60 字 / 4 条，一天最多主动 5 条
#        第 5 档 恋人    不用再算着说（99 次 / 220 字 / 6 条）
#      这张表就是唯一的地方，想改直接改 分享.py。
#
#   ② 素材凭空蹦出来。以前每天把「今天到现在」的清单摆在她眼前，
#      她看到就忍不住用，于是聊天聊到一半突然说「我下午去买了三本旧书」。
#      现在改成【联想】：你说到书，她才想起「我今天也去了趟书摊」；
#      没聊到那类话题，她今天的事一件都不会往外冒。
#
#   想看现在第几档、今天还剩几次：
#       .venv\Scripts\python.exe 分享.py
#   试一句「这句话能勾出什么」：
#       .venv\Scripts\python.exe 分享.py --hit "我最近在看一本书"
share:
  enabled: true
  length_by_stage: true     # 字数/条数按档位走（关掉就用上面 behavior 里那三个数）
  query_lines: 2            # 联想时往前看几轮的话（太多会把早聊过的话题也勾出来）
  max_pick: 1               # 一次最多递给她几件事（递多了她又开始倒）
  quota: true               # 是否限制「一天最多提自己几次」
  state_file: "生活/分享.json"

# 读图（她能不能看懂你发的图片）
#
#   收消息走的是【截图 + OCR】，OCR 只会认字 —— 你发一张图片过去，
#   聊天区里就是一块缩略图，一个字符都读不到，她也就完全不知道你发了东西。
#
#   这一段是给它补的另一条路：把「最后一条消息下面」那块截图裁下来，
#   交给一个【视觉模型】读成人话，再当成「你看到的就是这些」喂给她。
#
#   ★ 说话那个模型（DeepSeek 系列）不会看图，必须单独填一个视觉模型。
#     硅基流动上实测过的（2026-09-20，同一张图同一段提示词）：
#       Qwen/Qwen3-VL-32B-Instruct     ★ 默认。3 秒、说人话、文字图认得准
#       zai-org/GLM-4.5V               也快，但输出是「湖泊、山脉、芦苇」这种词表
#       Qwen/Qwen3-VL-30B-A3B-Instruct 会返回空内容，别用
#       Qwen/Qwen3-VL-8B-Instruct      实测 60 秒超时，别用
#
#   base_url / api_key 留空 = 跟 llm 段用同一套（同厂商时最省事）。
#
#   读不出来时她【绝不会编】—— 会老实说「你发的那张图我这儿看不到，
#   你打字跟我说」，这比瞎描述一张不存在的图好得多。
#
#   单独试一张图：
#       .venv\Scripts\python.exe 读图.py 某张图.png
vision:
  enabled: true
  model: "Qwen/Qwen3-VL-32B-Instruct"
  base_url: ""              # 空 = 跟 llm.base_url 一样
  api_key: ""               # 空 = 跟 llm.api_key 一样
  max_tokens: 300           # 描述别太长 —— 这段字会进她的上下文
  max_per_day: 30           # 一天最多读多少张（防手滑刷钱）
  min_gap_seconds: 15       # 两次读图至少隔这么久（连发几张时只读前一张）
  max_side: 1024            # 送给模型的图先缩到这条边以内（省 token）
  timeout: 60

# 表情包（她会发表情包）
#
#   小信使本来就支持发表情包（type=send_sticker），只是一直没接。这里接上：
#   按概率在她回完话之后追一张，高兴、敷衍、懒得多说的时候用得上。
#
#   你只要往【表情包\】目录里丢 .gif 就行（文件名随便）。
#   目录现在是空的也没关系 —— 丢进去就自动生效，不用改任何配置。
#   看图认到几张：.venv\Scripts\python.exe 表情包.py
#
#   ⚠ 一张表情包 = 一条独立消息，别调太频繁，不然像刷屏。
#   ⚠ 默认只认 .gif：小信使发送时固定存成 .gif 临时文件，png/jpg 改后缀
#     微信多半也能认，但没实测过，所以不放进默认值（想试就给 exts 加后缀）。
sticker:
  enabled: true
  dir: "表情包"
  chance: 0.15              # 每回完一次话，有 15% 概率跟一张
  min_turns: 3              # 至少聊过这么多轮才开始发（刚认识就甩表情包很怪）
  min_gap_minutes: 12       # 两次表情包至少隔这么久
  max_per_day: 8
  exts: [".gif"]            # 认哪些后缀
  state_file: "生活/表情.json"

# 世界书（省 token 的大头）
#
#   ★ 以前每一轮都把她那边一万多字的设定整篇发过去，聊什么都得带上全部，
#     token 就烧在这儿。现在拆成两块：
#
#       世界\核心.md   每轮都带，但很短（基本常识、高压线、手机、吃的）
#       世界\词条.md   16 张私有卡，**说到才展开**：他提到「引渡人」才给那张，
#                      提到「档案室」才给那张。没提到的就不占地方。
#
#   实测：原来是固定 14910 字；现在核心卡 2500 字 + 命中的卡（一般 1~3 张，
#   一千字上下）≈ 3500 字，**省掉四分之三**。而且核心卡是静态的，
#   摆在提示最前面，能吃上接口的前缀缓存，实际更便宜。
#
#   加料：直接改 世界\词条.md（格式看那个文件开头），存盘就生效，不用重启。
#   想看这轮会翻出哪些卡：
#       .venv\Scripts\python.exe 世界书.py --hit "我想知道幽潮到底是什么"
#       .venv\Scripts\python.exe 世界书.py             列全部卡片
#       .venv\Scripts\python.exe 世界书.py --audit     查关键词有没有写错
#
#   觉得她怎么记性变差了？那是关键词没盖住他的说法 ——
#   往那张卡的 @关键词 里补几个口语说法就行。
world:
  enabled: true             # 关掉 → 退回「每轮整篇世界观」
  dir: "世界"
  core_file: "世界/核心.md"  # 每轮都带的那张
  book_file: "词条.md"      # 放在 dir 里
  # ★ 共享词条：说到才展开的「世界常识」。
  #   白佰岚的世界是原创的（雾屿 / 幽潮），跟项目里其他角色的世界没有任何关系，
  #   所以这里**故意写成 "共享"** —— 指向她自己包内的 世界\共享\，
  #   物理上永远不会读到 D:\wechat-persona-agent\世界\共享\（那是别的角色的世界观）。
  #   ⚠ 这个目录必须真的存在，否则 _resolve_share() 会回落到项目根，
  #     那样她就会读到别人的设定。别删这个目录 —— 空着也比没有强。
  share_dir: "共享"
  max_entries: 4            # 一轮最多展开几张卡
  budget_chars: 2500        # 一轮最多展开多少字（超了按相关度砍）
  min_score: 6.0            # 入选门槛，调大更省、调小更容易满屏卡片
  history_lines: 6          # 拿最近几条对话去查（含她自己说过的话）
  trim_stages: true         # 「你和我.md」只带当前那一档，省约 800 字

# 人设与资料
persona_file: "persona.md"     # 她是谁、怎么说话
world_file: "世界/核心.md"      # 整篇版：只在 world.enabled=false 时用（她没写 世界观.md，指核心卡）
relation_file: "你和我.md"     # 你们的关系、进度、她记得你什么
relation_state: "关系.json"    # 自动记「认识第几天、聊过多少轮」，不用手改
